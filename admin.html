<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Portal — Kuppayam 3.0 | WIRAS, Markaz Knowledge City</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --forest: #013F32;
      --lime: #E7FE25;
      --white: #FDFDFD;
      --charcoal: #161616;

      --forest-10: rgba(1, 63, 50, 0.10);
      --forest-16: rgba(1, 63, 50, 0.16);
      --forest-25: rgba(1, 63, 50, 0.25);
      --lime-22: rgba(231, 254, 37, 0.22);
      --lime-35: rgba(231, 254, 37, 0.35);
      --charcoal-06: rgba(22, 22, 22, 0.06);
      --charcoal-12: rgba(22, 22, 22, 0.12);
      --charcoal-22: rgba(22, 22, 22, 0.22);
      --charcoal-65: rgba(22, 22, 22, 0.65);
      --charcoal-70: rgb(36, 36, 36);
      --white-52: rgba(253, 253, 253, 0.52);
      --white-78: rgba(253, 253, 253, 0.78);
      --white-85: rgba(253, 253, 253, 0.85);
      --white-92: rgba(253, 253, 253, 0.92);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      font-size: 16px;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--white);
      color: var(--charcoal);
      line-height: 1.55;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .ml-font {
      font-family: 'Noto Sans Malayalam', 'Plus Jakarta Sans', sans-serif;
    }

    .ambient-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      overflow: hidden;
      background:
        radial-gradient(circle at 12% 14%, var(--lime-22) 0%, transparent 42%),
        radial-gradient(circle at 88% 18%, var(--forest-10) 0%, transparent 44%),
        radial-gradient(circle at 75% 82%, var(--lime-22) 0%, transparent 40%),
        var(--white);
    }

    .ambient-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to right, var(--charcoal-06) 1px, transparent 1px),
        linear-gradient(to bottom, var(--charcoal-06) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: radial-gradient(ellipse at center, rgba(22, 22, 22, 0.5) 0%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse at center, rgba(22, 22, 22, 0.5) 0%, transparent 75%);
    }

    /* Glassy Floating Pill Navbar (Edit #7) */
    .nav-wrapper {
      position: sticky;
      top: 14px;
      z-index: 50;
      padding: 0 clamp(12px, 3vw, 32px);
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
    }

    .navbar-pill {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--white-52);
      backdrop-filter: blur(26px) saturate(185%);
      -webkit-backdrop-filter: blur(26px) saturate(185%);
      border: 1.5px solid var(--white-92);
      border-radius: 9999px;
      padding: 8px 10px 8px 20px;
      box-shadow:
        0 18px 40px -14px var(--charcoal-12),
        0 2px 10px -2px var(--forest-10),
        inset 0 1.5px 0 var(--white);
    }

    .brand-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--charcoal);
      font-weight: 800;
      font-size: 1.05rem;
      letter-spacing: -0.02em;
      cursor: pointer;
      background: none;
      border: none;
      padding: 4px 0;
      transition: transform 0.25s ease;
    }

    .brand-link:hover { transform: scale(1.02); }
    .brand-accent { color: var(--forest); }

    .brand-sup {
      font-size: 0.7rem;
      font-weight: 800;
      background: var(--lime);
      color: var(--charcoal);
      padding: 2px 7px;
      border-radius: 9999px;
      border: 1px solid var(--charcoal-12);
    }

    .brand-dots {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-left: 4px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      display: inline-block;
    }
    .dot-charcoal { background: var(--charcoal); }
    .dot-forest { background: var(--forest); }
    .dot-lime { background: var(--lime); border: 1px solid var(--charcoal); }

    .nav-track {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(253, 253, 253, 0.45);
      border: 1px solid var(--charcoal-06);
      padding: 4px;
      border-radius: 9999px;
      backdrop-filter: blur(12px);
    }

    /* Animated Button Hover System (Edit #6) */
    .nav-btn,
    .login-avatar-btn,
    .btn-primary,
    .btn-secondary,
    .filter-chip,
    .btn-submit-full,
    .demo-fill-btn,
    .carousel-arrow-btn {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1),
                  color 0.28s ease,
                  background-color 0.28s ease,
                  border-color 0.28s ease,
                  box-shadow 0.28s ease;
    }

    .nav-btn {
      border: none;
      background: transparent;
      color: var(--charcoal-65);
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 9999px;
      cursor: pointer;
      white-space: nowrap;
    }

    .nav-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--lime);
      border-radius: 9999px;
      transform: scale(0.75);
      opacity: 0;
      z-index: -1;
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.25s ease;
    }

    .nav-btn:hover {
      color: var(--charcoal);
      transform: translateY(-1px);
    }

    .nav-btn:hover::before {
      transform: scale(1);
      opacity: 1;
    }

    .nav-btn.active {
      background: var(--forest);
      color: var(--lime);
      box-shadow: 0 8px 18px -4px var(--forest-25);
    }

    .nav-btn.active::before {
      display: none;
    }

    .nav-actions-group {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .register-nav-btn {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 40px;
      padding: 0 16px;
      border-radius: 9999px;
      border: 1.5px solid var(--charcoal);
      background: var(--lime);
      color: var(--charcoal);
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), color 0.28s ease, border-color 0.28s ease, box-shadow 0.28s ease;
    }

    .register-nav-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--forest);
      transform: translateY(101%);
      z-index: -1;
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .register-nav-btn:hover,
    .register-nav-btn.active {
      color: var(--lime);
      border-color: var(--forest);
      transform: translateY(-2px);
      box-shadow: 0 10px 22px -6px var(--forest-25);
    }

    .register-nav-btn:hover::before,
    .register-nav-btn.active::before {
      transform: translateY(0);
    }

    @media (max-width: 520px) {
      .register-nav-btn, .login-avatar-btn {
        padding: 0 12px;
        height: 36px;
        font-size: 0.76rem;
      }
      .navbar-pill {
        padding: 6px 8px 6px 14px;
      }
      .brand-dots { display: none; }
    }

    .login-avatar-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 40px;
      padding: 0 16px;
      border-radius: 9999px;
      border: 1.5px solid var(--forest);
      background: var(--white-78);
      color: var(--forest);
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
    }

    .login-avatar-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--forest);
      transform: translateX(-101%);
      z-index: -1;
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .login-avatar-btn:hover,
    .login-avatar-btn.active {
      color: var(--lime);
      background: var(--forest);
      transform: translateY(-2px);
      box-shadow: 0 10px 22px -6px var(--forest-25);
    }

    .login-avatar-btn:hover::before {
      transform: translateX(0);
    }

    /* Mobile Bottom Glassy Menu Bar */
    .mobile-bottom-nav {
      display: none;
    }

    @media (max-width: 960px) {
      .nav-track { display: none; }

      .mobile-bottom-nav {
        display: flex;
        align-items: center;
        justify-content: space-around;
        gap: 4px;
        position: fixed;
        bottom: 14px;
        left: 50%;
        transform: translateX(-50%);
        width: calc(100% - 24px);
        max-width: 460px;
        z-index: 80;
        padding: 7px 10px;
        border-radius: 9999px;
        background: var(--white-52);
        backdrop-filter: blur(26px) saturate(185%);
        -webkit-backdrop-filter: blur(26px) saturate(185%);
        border: 1.5px solid var(--white-92);
        box-shadow:
          0 16px 40px -10px var(--charcoal-22),
          inset 0 1.5px 0 var(--white);
      }

      .mobile-nav-item {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        border: none;
        background: transparent;
        color: var(--charcoal-65);
        font-family: inherit;
        font-size: 0.7rem;
        font-weight: 700;
        padding: 7px 6px;
        border-radius: 9999px;
        cursor: pointer;
        transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .mobile-nav-item:hover {
        background: var(--lime-35);
        color: var(--charcoal);
      }

      .mobile-nav-item.active {
        background: var(--forest);
        color: var(--lime);
        box-shadow: 0 6px 14px -4px var(--forest-25);
      }

      .site-footer {
        padding-bottom: 98px !important;
      }
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 1240px;
      margin: 0 auto;
      padding: clamp(20px, 4vw, 44px) clamp(16px, 3vw, 32px) 64px;
    }

    .home-section {
      padding: 36px 0;
      scroll-margin-top: 90px;
    }

    .home-section:first-child { padding-top: 16px; }
    .page-hidden { display: none !important; }

    /* Hero Section with Responsive Video Background */
    #sec-home {
      position: relative;
      overflow: hidden;
      border-radius: 32px;
      padding: clamp(24px, 4vw, 48px) clamp(18px, 4vw, 42px) clamp(24px, 3.5vw, 36px);
      background: linear-gradient(135deg, rgba(231, 254, 37, 0.16), rgba(1, 63, 50, 0.08));
    }

    .hero-bg-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      z-index: 0;
      pointer-events: none;
    }

    .hero-bg-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(253, 253, 253, 0.72) 0%, rgba(253, 253, 253, 0.45) 100%);
      z-index: 1;
      pointer-events: none;
    }

.hero-bg-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to right, var(--charcoal-06) .1px, transparent 1px),
        linear-gradient(to bottom, var(--charcoal-06) .1px, transparent 1px);
      background-size: 56px 56px;
      z-index: 1;
      pointer-events: none;
    }

    #sec-home .hero-single,
    #sec-home .stats-grid {
      position: relative;
      z-index: 2;
    }

    .hero-single {
      padding: 8px 0 24px;
      max-width: 820px;
    }

    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--forest);
      margin-bottom: 14px;
    }

    .hero-title-wrap {
      position: relative;
      margin-bottom: 14px;
    }

    .hero-logo-3d-wrap {
      perspective: 900px;
      display: inline-block;
      width: 100%;
      max-width: clamp(240px, 44vw, 460px);
      margin: 4px 0 18px;
      cursor: pointer;
    }

    .hero-logo-img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
      transform-style: preserve-3d;
      will-change: transform;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), filter 0.28s ease;
      filter: drop-shadow(0 16px 28px var(--forest-16));
      user-select: none;
      -webkit-user-drag: none;
    }

    @media (max-width: 600px) {
      .hero-logo-3d-wrap {
        max-width: clamp(210px, 72vw, 320px);
        margin: 2px 0 14px;
      }
    }

    .hero-title-top {
      display: block;
      font-size: clamp(3rem, 7vw, 5.6rem);
      font-weight: 800;
      line-height: 0.96;
      letter-spacing: -0.04em;
      color: var(--forest);
      text-shadow:
        0 4px 0 var(--lime),
        0 10px 24px var(--forest-16);
    }

    .hero-title-bottom {
      display: inline-flex;
      align-items: flex-start;
      gap: 12px;
      font-size: clamp(3.3rem, 7.6vw, 6.1rem);
      font-weight: 800;
      line-height: 0.96;
      letter-spacing: -0.04em;
      color: var(--charcoal);
      text-shadow: 0 8px 22px var(--charcoal-12);
    }

    .hero-version-badge {
      font-size: clamp(1.1rem, 2.2vw, 1.8rem);
      font-weight: 800;
      background: var(--lime);
      color: var(--charcoal);
      padding: 6px 14px;
      border-radius: 16px;
      border: 2px solid var(--charcoal);
      box-shadow: 4px 4px 0 var(--forest);
      transform: translateY(6px);
    }

    .hero-subtitle {
      font-size: clamp(0.84rem, 1.4vw, 1.02rem);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--charcoal-65);
      margin-bottom: 22px;
    }

    .hero-subtitle strong { color: var(--forest); }

    .hero-meta-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 28px;
    }

    .meta-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--white);
      border: 1px solid var(--charcoal-12);
      border-radius: 9999px;
      padding: 10px 18px;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--charcoal);
      box-shadow: 0 8px 20px -10px var(--charcoal-12);
    }

    .meta-pill .accent-date { color: var(--forest); }

    .hero-ctas {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--lime);
      color: var(--charcoal);
      border: 2px solid var(--charcoal);
      border-radius: 9999px;
      padding: 13px 28px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 24px -8px var(--lime-35);
    }

    .btn-primary::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--forest);
      transform: translateY(102%);
      z-index: -1;
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .btn-primary:hover {
      color: var(--lime);
      border-color: var(--forest);
      transform: translateY(-3px);
      box-shadow: 0 14px 28px -8px var(--forest-25);
    }

    .btn-primary:hover::before {
      transform: translateY(0);
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--white);
      color: var(--forest);
      border: 1.5px solid var(--forest);
      border-radius: 9999px;
      padding: 13px 26px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-secondary::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--forest);
      transform: translateX(-102%);
      z-index: -1;
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .btn-secondary:hover {
      color: var(--lime);
      transform: translateY(-3px);
      box-shadow: 0 12px 24px -8px var(--forest-25);
    }

    .btn-secondary:hover::before {
      transform: translateX(0);
    }

    /* 3-Card Stats Row with Count-Up, '+', and Rich Color Hover (Edit #2) */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin: 18px 0 12px;
    }

    @media (max-width: 720px) {
      .stats-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin: 14px 0 8px;
      }
      .stat-card {
        padding: 14px 10px;
        border-radius: 18px;
      }
      .stat-card::after {
        width: 56px;
        height: 56px;
        top: -14px;
        right: -14px;
      }
      .stat-label {
        font-size: 0.62rem;
        letter-spacing: 0.08em;
        margin-bottom: 4px;
      }
      .stat-value {
        font-size: 1.45rem;
      }
    }

    .stat-card {
      position: relative;
      background: var(--white);
      border: 1.5px solid var(--charcoal-12);
      border-radius: 26px;
      padding: 26px 24px 24px;
      overflow: hidden;
      box-shadow: 0 12px 30px -16px var(--charcoal-12);
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
                  background-color 0.35s ease,
                  border-color 0.35s ease,
                  box-shadow 0.35s ease;
      cursor: default;
    }

    .stat-card::after {
      content: '';
      position: absolute;
      top: -28px;
      right: -28px;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      pointer-events: none;
      transition: transform 0.4s ease, opacity 0.4s ease;
    }

    .stat-card.glow-lime::after { background: radial-gradient(circle, var(--lime-35) 0%, transparent 72%); }
    .stat-card.glow-forest::after { background: radial-gradient(circle, var(--forest-16) 0%, transparent 72%); }

    .stat-card:hover {
      transform: translateY(-6px) scale(1.015);
      background: var(--forest);
      border-color: var(--lime);
      box-shadow: 0 22px 40px -14px var(--forest-25), 0 0 0 2px var(--lime);
    }

    .stat-card:hover::after {
      transform: scale(1.7);
      background: radial-gradient(circle, var(--lime-35) 0%, transparent 70%);
    }

    .stat-label {
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--charcoal-65);
      margin-bottom: 8px;
      transition: color 0.3s ease;
    }

    .stat-value {
      font-size: clamp(2.1rem, 3.6vw, 2.9rem);
      font-weight: 800;
      color: var(--charcoal);
      letter-spacing: -0.03em;
      line-height: 1.05;
      transition: color 0.3s ease;
    }

    .stat-card:hover .stat-label { color: var(--white-85); }
    .stat-card:hover .stat-value { color: var(--lime); }

    /* Section Header */
    .section-header { margin-bottom: 24px; }

    .section-kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--forest);
      margin-bottom: 8px;
    }

    .section-kicker::before {
      content: '';
      width: 22px;
      height: 2px;
      background: var(--forest);
    }

    .section-title {
      font-size: clamp(1.9rem, 3.6vw, 2.8rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--charcoal);
      line-height: 1.1;
    }

    /* Cards & Grids */
    .cards-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .cards-grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    @media (max-width: 920px) {
      .cards-grid-3 { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 620px) {
      .cards-grid-3, .cards-grid-2 { grid-template-columns: 1fr; }
    }

    .panel-card {
      background: var(--white);
      border: 1px solid var(--charcoal-12);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 12px 28px -16px var(--charcoal-12);
      transition: transform 0.25s ease, border-color 0.25s ease;
    }

    .panel-card:hover {
      border-color: var(--forest);
      transform: translateY(-2px);
    }

    .panel-card.dark-card {
      background: var(--forest);
      color: var(--white);
      border-color: var(--charcoal);
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 22px;
    }

    .filter-chip {
      border: 1.5px solid var(--charcoal-12);
      background: var(--white);
      color: var(--charcoal);
      padding: 9px 18px;
      border-radius: 9999px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }

    .filter-chip::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--lime);
      transform: scale(0.8);
      opacity: 0;
      z-index: -1;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }

    .filter-chip:hover {
      border-color: var(--charcoal);
      transform: translateY(-2px);
    }

    .filter-chip:hover::before {
      transform: scale(1);
      opacity: 1;
    }

    .filter-chip.active {
      background: var(--forest);
      color: var(--lime);
      border-color: var(--forest);
    }

    .filter-chip.active::before { display: none; }

    /* Stories Carousel Showcase (Edit #5 — matching image_4da564.png) */
    .stories-showcase {
      display: grid;
      grid-template-columns: minmax(0, 520px) 1fr;
      gap: clamp(28px, 4.5vw, 56px);
      align-items: center;
      padding: 12px 0 24px;
    }

    @media (max-width: 960px) {
      .stories-showcase { grid-template-columns: 1fr; }
    }

    .stories-carousel-stage {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      max-width: 520px;
      min-width: 0;
      margin: 0 auto;
      padding: 12px 0 34px;
    }

    .carousel-arrow-btn {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid var(--charcoal);
      background: var(--white);
      color: var(--charcoal);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 3;
      box-shadow: 0 8px 20px -8px var(--charcoal-22);

    @media (max-width: 600px) {

        gap: 6px;
        padding: 8px 0 24px;
      }
      .carousel-arrow-btn {
        width: 32px;
        height: 32px;
      }
    }

    .carousel-arrow-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--lime);
      transform: scale(0);
      border-radius: 50%;
      z-index: -1;
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .carousel-arrow-btn:hover {
      transform: scale(1.08);
      border-color: var(--forest);
    }

    .carousel-arrow-btn:hover::before {
      transform: scale(1);
    }

    .stories-viewport {
      position: relative;
      overflow: hidden;
      flex: 1;
      min-width: 0;
      z-index: 2;
      border-radius: 22px;
    }

    .stories-track {
      display: flex;
      gap: 14px;
      transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
    }

    .story-slide-card {
      flex: 0 0 calc(50% - 7px);
      height: 320px;
      border-radius: 22px;
      padding: 20px 18px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      border: 2px solid var(--charcoal);
      background: linear-gradient(175deg, var(--forest) 0%, var(--charcoal) 92%);
      color: var(--white);
      box-shadow: 0 18px 36px -14px var(--charcoal-65);
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .story-slide-card:nth-child(even) {
      background: linear-gradient(175deg, var(--charcoal) 0%, var(--forest) 92%);
    }

    .story-slide-card:hover {
      transform: translateY(-4px);
      border-color: var(--lime);
    }

    @media (max-width: 600px) {
      .stories-track { gap: 10px; }
      .story-slide-card {
        flex: 0 0 calc(50% - 5px);
        height: 200px;
        padding: 14px 12px;
        border-radius: 16px;
      }
      .story-slide-date { font-size: 0.6rem; }
      .story-slide-num { font-size: 1.5rem; }
      .story-slide-title { font-size: 0.85rem; }
    }

    .story-slide-art {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 96px;
      height: 96px;
      opacity: 0.25;
      pointer-events: none;
    }

    .story-slide-num {
      font-size: 2.3rem;
      font-weight: 800;
      line-height: 1;
      color: var(--lime);
      letter-spacing: -0.04em;
    }

    .story-slide-title {
      font-size: 1.25rem;
      font-weight: 800;
      line-height: 1.2;
      text-transform: uppercase;
      letter-spacing: -0.01em;
      margin-top: 8px;
      color: var(--white);
    }

    .story-slide-date {
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--lime);
      text-transform: uppercase;

    .stories-copy-col p {
      font-size: 1rem;
      line-height: 1.7;
      color: var(--charcoal-65);

    /* Standalone Login Page */
    .login-split {
      display: grid;
      grid-template-columns: 1fr 440px;
      gap: clamp(24px, 5vw, 64px);

    }

    @media (max-width: 900px) {

    .login-card {

      border: 1.5px solid var(--charcoal-12);
      border-radius: 28px;
      padding: 28px;
      box-shadow: 0 24px 48px -18px var(--charcoal-12);
    }

    .auth-tabs {
      display: grid;

      gap: 6px;

    .auth-tab {

      font-weight: 700;
      padding: 10px 14px;
      border-radius: 9999px;

    .auth-tab.active {

    .form-group { margin-bottom: 16px; }

    .btn-submit-full {

      padding: 14px 20px;

      border: 2px solid var(--charcoal);
      background: var(--lime);
      color: var(--charcoal);
      font-family: inherit;
      font-size: 0.96rem;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-submit-full::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--forest);
      transform: translateX(-101%);
      z-index: -1;
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .btn-submit-full:hover {
      color: var(--lime);
      border-color: var(--forest);
      transform: translateY(-2px);

    .demo-hint {
      margin-top: 14px;
      padding: 10px 14px;

      align-items: center;

      background: var(--forest);

      font-size: 0.75rem;

      background: var(--lime);

    /* Dark Rounded Footer */
    .site-footer {
      position: relative;
      background: var(--charcoal);
      color: var(--white);
      border-radius: 36px 36px 0 0;
      padding: clamp(36px, 5vw, 56px) clamp(20px, 4vw, 48px) 28px;
      margin-top: auto;
      overflow: hidden;
    }

    .site-footer::after {
      content: '';
      position: absolute;
      bottom: -80px;
      right: -60px;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--forest) 0%, transparent 70%);
      pointer-events: none;
    }

    .footer-inner {
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr;
      gap: 32px;
      padding-bottom: 32px;
      border-bottom: 1px solid rgba(253, 253, 253, 0.14);
    }

      .footer-grid { grid-template-columns: 1fr; gap: 24px; }
    }

    .footer-brand {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.03em;

    }

    .footer-brand span { color: var(--lime); }

    .footer-col-title {
      font-size: 0.72rem;
      font-weight: 800;

      text-transform: uppercase;

    }

    .footer-links {

      flex-direction: column;

    .footer-link-btn {
      background: none;
      border: none;
      color: var(--white-85);
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      padding: 2px 0;

    .footer-link-btn:hover {
      color: var(--lime);

    }

    .footer-bottom {
      padding-top: 20px;

      flex-wrap: wrap;

    /* Modal & Toast */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(22, 22, 22, 0.55);
      backdrop-filter: blur(6px);

      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-backdrop.open { display: flex; }

    .modal-box {
      background: var(--white);
      border: 2px solid var(--charcoal);
      border-radius: 28px;
      max-width: 520px;
      width: 100%;
      padding: 28px;
      box-shadow: 0 24px 48px -12px var(--charcoal-65);
      animation: fadeSlideUp 0.25s ease forwards;

    .toast {
      position: fixed;
      bottom: 84px;

      color: var(--lime);

      padding: 12px 20px;
      border-radius: 9999px;
      font-size: 0.88rem;

      transform: translateY(16px);

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .badge-pill {
      display: inline-block;
      padding: 4px 12px;

      font-size: 0.74rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;

    .badge-lime {
      background: var(--lime);
      color: var(--charcoal);

    }

    .badge-forest {

      color: var(--lime);
    }


    /* Admin Portal (Of-Arcrino Portal Style) */
    .portal-shell {
      display: grid;
      grid-template-columns: 250px 1fr;
      gap: 24px;
      align-items: start;
    }

    @media (max-width: 900px) {

      }
    }

    .portal-sidebar {
      background: var(--white);
      border: 1.5px solid var(--charcoal-12);
      border-radius: 26px;
      padding: 22px 16px;

      flex-direction: column;
      justify-content: space-between;
      gap: 24px;
      box-shadow: 0 14px 32px -16px var(--charcoal-12);

    @media (max-width: 900px) {

    }

    .portal-nav-btn {
      width: 100%;

      gap: 10px;
      border: none;
      background: transparent;

      font-size: 0.9rem;
      font-weight: 700;
      padding: 11px 14px;
      border-radius: 14px;

      text-align: left;

    }

    .portal-nav-btn:hover {

    }

    .portal-nav-btn.active {

      color: var(--lime);
    }

    .portal-stats-4 {
      display: grid;

      gap: 14px;
      margin-bottom: 18px;

    }

    .portal-stat-box {
      background: var(--white);
      border: 1px solid var(--charcoal-12);
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 10px 24px -16px var(--charcoal-12);
    }

    .portal-filter-bar {
      background: var(--white);
      border: 1px solid var(--charcoal-12);

      padding: 14px 16px;

      flex-wrap: wrap;

      align-items: center;

      background: var(--white);
      border: 1.5px solid var(--charcoal-12);
      border-radius: 20px;
      padding: 16px 20px;

      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;

    .row-menu-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .dots-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--charcoal-12);
      background: var(--white);
      color: var(--charcoal);

      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .dots-btn:hover {
      background: var(--lime);
      border-color: var(--charcoal);
    }

    .row-dropdown {
      position: absolute;
      top: 40px;
      right: 0;
      min-width: 148px;
      background: var(--white);
      border: 1.5px solid var(--charcoal);
      border-radius: 16px;
      padding: 6px;
      box-shadow: 0 16px 32px -10px var(--charcoal-22);
      z-index: 40;
      display: none;
      flex-direction: column;
      gap: 4px;
    }

    .row-dropdown.open {
      display: flex;
    }

    .row-dropdown-item {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--charcoal);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 9px 12px;
      border-radius: 10px;
      text-align: left;
      cursor: pointer;
      transition: background-color 0.18s ease, color 0.18s ease;
    }

    .row-dropdown-item:hover {
      background: var(--lime);
      color: var(--charcoal);
    }

    .row-dropdown-item.danger:hover {
      background: var(--forest);
      color: var(--lime);
    }

    .student-row-card:hover {
      transform: translateY(-2px);
      border-color: var(--forest);
      box-shadow: 0 12px 26px -14px var(--forest-25);
    }

    .student-row-card.menu-open {
      z-index: 60;
      transform: none;

    .tick-box-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      padding: 16px 18px;
      border-radius: 18px;
      background: var(--forest-10);
      border: 1.5px solid var(--forest);
      margin-bottom: 20px;
      align-items: center;
      justify-content: space-between;
    }

    .tick-label {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 0.95rem;
      color: var(--forest);
      cursor: pointer;

    .tick-label input[type="checkbox"] {

    body.admin-mode .nav-track,
    body.admin-mode .mobile-bottom-nav,
    body.admin-mode .site-footer,
    body.admin-mode #loginBackHomeBtn {
      display: none !important;
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Minimal Style & Squashing Shapes */
    .ambient-squash {
      position: absolute;
      border-radius: 44% 56% 62% 38% / 48% 42% 58% 52%;
      pointer-events: none;
      filter: blur(2px);
      animation: squashMorph 14s ease-in-out infinite alternate;
    }

    .ambient-squash-1 {
      top: 6%;
      right: -70px;
      width: 340px;
      height: 290px;
      background: radial-gradient(circle at 35% 35%, var(--lime-22), transparent 72%);
    }

    .ambient-squash-2 {
      bottom: 14%;
      left: -80px;
      width: 360px;
      height: 300px;
      background: radial-gradient(circle at 60% 50%, var(--forest-10), transparent 72%);
      animation-delay: -6s;
      animation-duration: 18s;
    }

    @keyframes squashMorph {
      0% {
        border-radius: 44% 56% 62% 38% / 48% 42% 58% 52%;
        transform: translate(0, 0) scale(1, 1) rotate(0deg);
      }
      50% {
        border-radius: 58% 42% 46% 54% / 38% 62% 44% 56%;
        transform: translate(18px, -14px) scale(1.08, 0.92) rotate(8deg);
      }
      100% {
        border-radius: 38% 62% 54% 46% / 58% 44% 56% 42%;
        transform: translate(-12px, 16px) scale(0.94, 1.07) rotate(-6deg);
      }
    }

    /* Remove heavy outlines across surfaces & buttons for minimal look */
    .panel-card,
    .stat-card,
    .portal-sidebar,
    .portal-stat-box,
    .portal-filter-bar,
    .student-row-card,
    .login-card,
    .meta-pill {
      border: 1px solid rgba(22, 22, 22, 0.05);
      box-shadow: 0 12px 32px -16px rgba(22, 22, 22, 0.10);
    }

    .panel-card.dark-card {
      border: none;
      box-shadow: 0 18px 36px -18px var(--forest-25);
    }

    .btn-primary,
    .btn-secondary,
    .btn-submit-full,
    .register-nav-btn,
    .login-avatar-btn,
    .filter-chip,
    .carousel-arrow-btn,
    .dots-btn,
    .badge-lime {
      border: none;
      box-shadow: 0 8px 20px -10px rgba(22, 22, 22, 0.16);
    }

    .btn-secondary,
    .filter-chip,
    .login-avatar-btn,

    .dots-btn {
      background: var(--white);
    }

    .story-slide-card {

      box-shadow: 0 18px 36px -16px rgba(22, 22, 22, 0.26);
    }

    .tick-box-bar {
      border: none;
      background: var(--forest-10);
    }

    .modal-box {
      border: none;
      box-shadow: 0 28px 60px -16px rgba(22, 22, 22, 0.35);
    }

    .row-dropdown {
      border: 1px solid rgba(22, 22, 22, 0.08);
    }

    /* Subtle squash-and-stretch tactile feedback on interactive elements */
    .btn-primary:active,
    .btn-secondary:active,
    .btn-submit-full:active,
    .register-nav-btn:active,
    .login-avatar-btn:active,
    .filter-chip:active,
    .carousel-arrow-btn:active {
      transform: scale(1.04, 0.94) !important;
    }

    .stat-card:hover {
      box-shadow: 0 22px 40px -14px var(--forest-25);
      transform: translateY(-4px) scale(1.02, 0.985);
    }

    /* Big Box Students List with Thick Black Row Dividers */
    .students-big-box {
      background: var(--white);
      border: 0.5px solid rgba(22, 22, 22, 0.35);
      border-radius: 24px;

      flex-direction: column;
      box-shadow: 0 16px 36px -18px rgba(22, 22, 22, 0.14);

    .students-big-box .student-row-card {

      border-bottom: 0.5px solid rgba(22, 22, 22, 0.35);

      transition: background-color 0.22s ease;

    /* Of-Arcrino Video-Inspired Marquee Ticker */
    .ticker-strip {
      width: 100vw;

    // Page file names. If you rename a file on GitHub, change it here (same line in all 3 files).
    const PAGES = { home: 'index.html', student: 'student.html', admin: 'admin.html' };
    // ---- Session (shared by index.html, student.html and admin.html) ----
    // Login on the home page saves a small session in this browser tab, then opens the right page.
    const SESSION_KEY = 'kuppayam_session_v1';
    function getSession() {
      try { return JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null'); } catch (err) { return null; }
    }
    function setSession(sess) {
      try { sessionStorage.setItem(SESSION_KEY, JSON.stringify(sess)); } catch (err) {}
    }
    function clearSession() {
      try { sessionStorage.removeItem(SESSION_KEY); } catch (err) {}
    }
    function setFlash(msg) {
      try { sessionStorage.setItem('kuppayam_flash', msg); } catch (err) {}
    }
    function showFlash() {
      try {
        const msg = sessionStorage.getItem('kuppayam_flash');
        if (msg) { sessionStorage.removeItem('kuppayam_flash'); showToast(msg); }
      } catch (err) {}
    }
    // Only a signed-in admin may open this page; everyone else goes back to the home page.
    (function () {
      const sess = getSession();
      if (!sess || sess.role !== 'admin') window.location.replace(PAGES.home);
    })();
  </script>

    function showToast(msg) {
      const t = document.getElementById('toast');

      t.classList.add('show');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => t.classList.remove('show'), 2800);

    function saveStudentsToStorage() {
      try {
        localStorage.setItem('kuppayam_students_v1', JSON.stringify({
          students: state.students,
          nextRegSeq: state.nextRegSeq
        }));
      } catch (err) {}
      cloudPush();

    function loadStudentsFromStorage() {
      try {
        const raw = localStorage.getItem('kuppayam_students_v1');
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed.students) && parsed.students.length) {
            state.students = parsed.students;
          }
          if (typeof parsed.nextRegSeq === 'number') {
            state.nextRegSeq = parsed.nextRegSeq;
          }
        }
      } catch (err) {}
    }

    // ---- Cloud sync (shared live data) ----
    function cloudPush() {

    }
    (function startCloudListen() {
      if (!window.Cloud) return;
      let firstSnap = true;
      Cloud.listen(function (list, isEmpty) {
        if (firstSnap && isEmpty && true && state.students.length) {
          // first run: upload old local data to cloud
          firstSnap = false;
          Cloud.sync(state.students, true);
          return;
        }
        firstSnap = false;
        state.students = list;
        try {

    function generateStudentIdCardDataUrl(stu) {
      const canvas = document.createElement('canvas');
      canvas.width = 800;
      canvas.height = 1100;
      const ctx = canvas.getContext('2d');

      // Background
      ctx.fillStyle = '#013F32';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Outer lime border
      ctx.strokeStyle = '#E7FE25';
      ctx.lineWidth = 10;
      ctx.strokeRect(28, 28, canvas.width - 56, canvas.height - 56);

      // Top header
      ctx.fillStyle = '#E7FE25';
      ctx.font = 'bold 28px Plus Jakarta Sans, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('KUPPAYAM 3.0 · STUDENT ID CARD', canvas.width / 2, 105);

      ctx.fillStyle = 'rgba(253,253,253,0.75)';
      ctx.font = '20px Plus Jakarta Sans, sans-serif';
      ctx.fillText('WINTER INTENSIVE CAMP · WIRAS, MARKAZ KNOWLEDGE CITY', canvas.width / 2, 142);

      // Chest / Register Number Pill
      const regText = stu.regNo || 'PENDING';
      ctx.fillStyle = '#E7FE25';
      ctx.beginPath();
      ctx.roundRect(230, 185, 340, 74, 37);
      ctx.fill();
      ctx.fillStyle = '#161616';
      ctx.font = 'bold 38px Plus Jakarta Sans, sans-serif';
      ctx.fillText(regText, canvas.width / 2, 235);

      // Student Details Card
      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      ctx.beginPath();
      ctx.roundRect(70, 295, 660, 240, 22);
      ctx.fill();

      ctx.textAlign = 'left';
      ctx.fillStyle = '#E7FE25';
      ctx.font = 'bold 18px Plus Jakarta Sans, sans-serif';
      ctx.fillText('STUDENT NAME', 110, 350);
      ctx.fillStyle = '#FDFDFD';
      ctx.font = 'bold 38px Plus Jakarta Sans, sans-serif';
      ctx.fillText((stu.name || '').toUpperCase(), 110, 398);

      ctx.fillStyle = '#E7FE25';
      ctx.font = 'bold 18px Plus Jakarta Sans, sans-serif';
      ctx.fillText('DATE OF BIRTH', 110, 460);
      ctx.fillStyle = '#FDFDFD';
      ctx.font = 'bold 28px Plus Jakarta Sans, sans-serif';
      ctx.fillText(stu.dob || '-', 110, 498);

      ctx.fillStyle = '#E7FE25';
      ctx.font = 'bold 18px Plus Jakarta Sans, sans-serif';
      ctx.fillText('CLASS & PLACE', 420, 460);
      ctx.fillStyle = '#FDFDFD';
      ctx.font = 'bold 24px Plus Jakarta Sans, sans-serif';
      ctx.fillText((stu.studentClass || '') + ' · ' + (stu.place || ''), 420, 498);

      // QR Code Box
      const loginUrl = getStudentAutoLoginUrl(stu);
      ctx.fillStyle = '#FDFDFD';
      ctx.beginPath();
      ctx.roundRect(235, 580, 330, 330, 24);
      ctx.fill();

      if (typeof qrcode !== 'undefined') {
        const qr = qrcode(0, 'L');
        qr.addData(loginUrl);
        qr.make();
        const count = qr.getModuleCount();
        const qrSize = 256;
        const cell = Math.floor(qrSize / count);
        const actualSize = cell * count;
        const startX = 235 + Math.floor((330 - actualSize) / 2);
        const startY = 580 + Math.floor((330 - actualSize) / 2);
        ctx.fillStyle = '#000000';
        for (let r = 0; r < count; r++) {
          for (let c = 0; c < count; c++) {
            if (qr.isDark(r, c)) {
              ctx.fillRect(startX + c * cell, startY + r * cell, cell, cell);
            }
          }
        }
      } else {
        ctx.fillStyle = '#161616';
        ctx.textAlign = 'center';
        ctx.font = 'bold 20px Plus Jakarta Sans, sans-serif';
        ctx.fillText('QR: ' + regText, canvas.width / 2, 750);
      }

      ctx.textAlign = 'center';
      ctx.fillStyle = '#E7FE25';
      ctx.font = 'bold 22px Plus Jakarta Sans, sans-serif';
      ctx.fillText('SCAN QR TO AUTO-LOGIN TO STUDENT PORTAL', canvas.width / 2, 960);

      ctx.fillStyle = 'rgba(253,253,253,0.65)';
      ctx.font = '18px Plus Jakarta Sans, sans-serif';
      ctx.fillText('24 – 26 DECEMBER 2026 · WIRAS, MARKAZ KNOWLEDGE CITY', canvas.width / 2, 1015);

      return canvas.toDataURL('image/png');
    }

    function sendAllPaymentReminders() {

      }
      const msg = getReminderMessageText();

      let opened = 0;
      let blocked = 0;
      pendingList.forEach(stu => {
        const digits = (stu.whatsapp || '').replace(/\D/g, '');
        if (!digits) return;
        const waNumber = digits.length === 10 ? '91' + digits : digits;

          opened++;
        } else {
          blocked++;
        }
        stu.reminderSent = true;
      });
      saveStudentsToStorage();
      if (blocked > 0) {
        showToast('Opened ' + opened + ' WhatsApp tabs (' + blocked + ' blocked by browser pop-up blocker — please allow pop-ups for this site).');
      } else {
        showToast('Opened WhatsApp reminder for all ' + opened + ' pending students.');

    function exportAttendanceCSV() {
      const paidStudents = state.students.filter(stu => stu.paymentCompleted);
      if (!paidStudents.length) {
        showToast('No payment-completed students to export yet.');
        return;
      }
      const headers = ['Chest / Register No', 'Name', 'Class', 'Place', 'Gender', 'WhatsApp Number', 'Contact Number', 'Day 1 (24 Dec)', 'Day 2 (25 Dec)', 'Day 3 (26 Dec)', 'Total Days Present'];
      const esc = (v) => '"' + String(v ?? '').replace(/"/g, '""') + '"';
      const rows = paidStudents.map(stu => {
        const att = stu.attendance || { 1: false, 2: false, 3: false };
        const d1 = att[1] ? 'Present' : 'Absent';
        const d2 = att[2] ? 'Present' : 'Absent';
        const d3 = att[3] ? 'Present' : 'Absent';
        const total = (att[1] ? 1 : 0) + (att[2] ? 1 : 0) + (att[3] ? 1 : 0);
        return [
          stu.regNo || '',
          stu.name,
          stu.studentClass,
          stu.place,
          stu.gender,
          stu.whatsapp,
          stu.contact,
          d1,
          d2,
          d3,
          total
        ].map(esc).join(',');
      });
      const csv = [headers.map(esc).join(','), ...rows].join('\r\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'kuppayam-3.0-attendance.csv';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Exported attendance CSV (' + paidStudents.length + ' students)!');
    }

                  Reminder (${pendingCount})
                </button>
                <button type="button" class="portal-nav-btn ${state.adminTab === 'feedback' ? 'active' : ''}" onclick="setAdminTab('feedback')">
                  Feedback
                </button>
                <button type="button" class="portal-nav-btn ${state.adminTab === 'certificate' ? 'active' : ''}" onclick="setAdminTab('certificate')">
                  E-Certificate (${state.students.filter(x => x.certStatus === 'pending').length})
                </button>
              </div>

              <div style="border-top: 1px solid var(--charcoal-12); padding-top: 14px;">
                <button type="button" class="btn-submit-full" style="padding:10px 14px; font-size:0.86rem;" onclick="logoutUser()">Log Out</button>
              </div>
            </aside>

            <div>
              ${state.adminTab === 'students' ? `
                <div class="panel-card" style="margin-bottom: 18px;">
                  <div class="section-kicker" style="margin-bottom:4px;">REGISTRATIONS</div>
                  <h2 style="font-size:1.8rem; font-weight:800; line-height:1.15;">Kuppayam 3.0 Students</h2>
                  <p style="font-size:0.88rem; color:var(--charcoal-65); margin-top:4px;">Select any student to inspect their details, verify payment, and generate their Register Number (e.g. K3001).</p>
                  ${window.location.protocol === 'file:' ? `
                  ` : ''}
                </div>

                <div class="portal-stats-4">
                  <div class="portal-stat-box">
                    <div class="stat-label">STUDENTS</div>
                    <div style="font-size:1.7rem; font-weight:800;">${total}</div>
                  </div>
                  <div class="portal-stat-box">
                    <div class="stat-label">PAID</div>
                    <div style="font-size:1.7rem; font-weight:800; color:var(--forest);">${paidCount}</div>
                  </div>
                  <div class="portal-stat-box">
                    <div class="stat-label">PENDING</div>
                    <div style="font-size:1.7rem; font-weight:800;">${pendingCount}</div>
                  </div>
                </div>

                ${selectedStu ? `
                  <div class="panel-card" style="margin-bottom:18px; border:2px solid var(--forest);">
                    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:16px;">
                      <div>
                        <span class="badge-pill badge-forest">STUDENT RECORD</span>
                        <h3 style="font-size:1.5rem; font-weight:800; margin-top:6px;">${selectedStu.name}</h3>
                      </div>
                      <div style="display:flex; flex-wrap:wrap; gap:10px; align-items:center;">
                        <button type="button" class="btn-primary" style="padding:8px 16px; font-size:0.84rem;" onclick="sendStudentWelcomeWhatsApp('${selectedStu.id}')">
                          Send Welcome Message
                        </button>
                        <button type="button" class="btn-primary" style="padding:8px 16px; font-size:0.84rem;" onclick="sendStudentPaymentWhatsApp('${selectedStu.id}')">
                          ${selectedStu.paymentMsgSent ? 'Resend Payment Message' : 'Send Payment Message'}
                        </button>
                        <button type="button" class="btn-secondary" style="padding:8px 16px; font-size:0.84rem;" onclick="previewStudentIdCard('${selectedStu.id}')">
                          Preview ID Card
                        </button>
                        <button type="button" class="btn-secondary" style="padding:8px 16px; font-size:0.84rem;" onclick="selectAdminStudent(null)">&larr; All Students</button>
                      </div>
                    </div>

                    <div class="tick-box-bar">
                      <div style="display:flex; flex-wrap:wrap; gap:18px; align-items:center;">
                        <label class="tick-label">
                          <input type="checkbox" ${selectedStu.paymentCompleted ? 'checked' : ''} onchange="togglePaymentComplete('${selectedStu.id}', this.checked)" />
                          <span>Complete Payment</span>
                        </label>
                        <label class="tick-label">
                          <input type="checkbox" ${selectedStu.welcomeSent ? 'checked' : ''} onchange="toggleWelcomeSent('${selectedStu.id}', this.checked)" />
                          <span>Send Welcome Message</span>
                        </label>
                        <label class="tick-label">
                          <input type="checkbox" ${selectedStu.paymentMsgSent ? 'checked' : ''} onchange="togglePaymentMsgSent('${selectedStu.id}', this.checked)" />
                          <span>Payment Message</span>
                        </label>
                      </div>
                      <div>
                        ${selectedStu.regNo
                          ? `<span class="badge-pill badge-lime" style="font-size:0.9rem; padding:7px 16px;">REGISTER NO: ${selectedStu.regNo}</span>`
                          : `<span style="font-size:0.82rem; font-weight:700; color:var(--charcoal-65);">Tick "Complete Payment" to generate Register No.</span>`
                        }
                      </div>
                    </div>

                    <div class="cards-grid-3" style="gap:14px;">
                      <div class="panel-card" style="padding:14px;"><div class="stat-label">NAME</div><strong>${selectedStu.name}</strong></div>
                      <div class="panel-card" style="padding:14px;"><div class="stat-label">DATE OF BIRTH</div><strong>${selectedStu.dob}</strong></div>
                      <div class="panel-card" style="padding:14px;"><div class="stat-label">PLACE</div><strong>${selectedStu.place}</strong></div>
                      <div class="panel-card" style="padding:14px;"><div class="stat-label">GENDER</div><strong>${selectedStu.gender}</strong></div>
                      <div class="panel-card" style="padding:14px;"><div class="stat-label">CLASS</div><strong>${selectedStu.studentClass}</strong></div>
                      <div class="panel-card" style="padding:14px;"><div class="stat-label">WHATSAPP NUMBER</div><strong>${selectedStu.whatsapp}</strong></div>
                      <div class="panel-card" style="padding:14px;"><div class="stat-label">CONTACT NUMBER</div><strong>${selectedStu.contact}</strong></div>
                      <div class="panel-card" style="padding:14px;"><div class="stat-label">REGISTER NUMBER</div><strong>${selectedStu.regNo || 'Pending Payment'}</strong></div>
                    </div>
                  </div>
                ` : `
                  <div class="portal-filter-bar">
                    <input id="admSearch" class="form-input" style="flex:1; min-width:180px;" placeholder="Search name, place, WhatsApp, or Reg No..." oninput="renderAdminStudentsList()" />
                    <select id="admClassFilter" class="form-select" style="width:auto;" onchange="renderAdminStudentsList()">
                      <option value="All">All Classes</option>
                      <option value="Class 8">Class 8</option>
                      <option value="Class 9">Class 9</option>
                      <option value="Class 10">Class 10</option>
                    </select>
                    <select id="admPayFilter" class="form-select" style="width:auto;" onchange="renderAdminStudentsList()">
                      <option value="All">All Status</option>
                      <option value="Completed">Payment Complete</option>
                      <option value="Pending">Pending Payment</option>
                    </select>
                  </div>
                  <div id="adminStudentsList" class="students-big-box"></div>
                `}
              ` : state.adminTab === 'reminder' ? `
                ${(() => {
                  const pendingList = state.students.filter(x => !x.paymentCompleted);
                  return `
                    <div class="panel-card" style="margin-bottom: 18px; display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:14px;">
                      <div>
                        <div class="section-kicker" style="margin-bottom:4px;">PAYMENT REMINDER</div>
                        <h2 style="font-size:1.8rem; font-weight:800; line-height:1.15;">Pending Payment Students (${pendingList.length})</h2>
                        <p style="font-size:0.88rem; color:var(--charcoal-65); margin-top:4px;">Send a WhatsApp payment reminder individually or to all pending students in one click.</p>
                      </div>

                    </div>

                    <div class="panel-card" style="margin-bottom: 18px;">
                      <label for="reminderMsgTemplate" class="stat-label" style="display:block; margin-bottom:8px;">WHATSAPP REMINDER MESSAGE (SENT TO ALL PENDING STUDENTS)</label>
                      <textarea id="reminderMsgTemplate" class="form-input" rows="4" style="width:100%; resize:vertical; font-family:inherit;" oninput="state.reminderMessage = this.value">${state.reminderMessage}</textarea>
                    </div>

                    <div style="display:flex; flex-direction:column; gap:10px;">
                      ${pendingList.length ? pendingList.map(stu => `
                        <div class="student-row-card" style="cursor:default;">
                          <div>
                            <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                              <strong style="font-size:1.05rem;">${stu.name}</strong>
                              <span class="badge-pill badge-forest">Pending Payment</span>
                              ${stu.reminderSent ? '<span class="badge-pill badge-lime">Reminder Sent</span>' : ''}
                            </div>
                            <p style="font-size:0.84rem; color:var(--charcoal-65); margin-top:4px;">
                              ${stu.studentClass} · ${stu.place} · WhatsApp: ${stu.whatsapp}
                            </p>
                          </div>
                          <button type="button" class="btn-primary" style="padding:9px 16px; font-size:0.84rem; white-space:nowrap;" onclick="sendStudentReminderWhatsApp('${stu.id}')">
                            ${stu.reminderSent ? 'Resend Reminder' : 'Send Reminder'}
                          </button>
                        </div>
                      `).join('') : '<div class="panel-card"><p style="color:var(--charcoal-65);">All registered students have completed their payment.</p></div>'}
                    </div>
                  `;
                })()}
              ` : state.adminTab === 'feedback' ? `
                ${(() => {
                  const cat = state.feedbackCategory || 'overall';
                  const selStu = state.selectedFeedbackStuId ? state.students.find(x => x.id === state.selectedFeedbackStuId) : null;
                  return `
                    <div class="panel-card" style="margin-bottom: 18px;">
                      <div class="section-kicker" style="margin-bottom:4px;">STUDENT FEEDBACK</div>
                      <h2 style="font-size:1.8rem; font-weight:800; line-height:1.15;">Feedback Center</h2>
                      <p style="font-size:0.88rem; color:var(--charcoal-65); margin-top:4px;">Choose a feedback category, then click any student name to read their rating and feedback.</p>
                      <div class="chip-row" style="margin-top:14px; margin-bottom:0;">
                        <button type="button" class="filter-chip ${cat === 'overall' ? 'active' : ''}" onclick="setFeedbackCategory('overall')">1. Overall Feedback</button>
                        <button type="button" class="filter-chip ${cat === 'event' ? 'active' : ''}" onclick="setFeedbackCategory('event')">2. Each Event Feedback</button>
                      </div>
                    </div>

                    ${selStu ? `
                      <div class="panel-card" style="border:2px solid var(--forest);">
                        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:16px;">
                          <div>
                            <span class="badge-pill badge-forest">${cat === 'overall' ? 'OVERALL FEEDBACK' : 'EVENT FEEDBACK'}</span>
                            <h3 style="font-size:1.45rem; font-weight:800; margin-top:6px;">${selStu.name}</h3>
                            <p style="font-size:0.84rem; color:var(--charcoal-65);">${selStu.regNo || 'Pending Payment'} · ${selStu.studentClass} · ${selStu.place}</p>
                          </div>
                          <button type="button" class="btn-secondary" style="padding:8px 16px; font-size:0.84rem;" onclick="selectFeedbackStudent(null)">&larr; All Students</button>
                        </div>

                        ${cat === 'overall' ? `
                          ${selStu.overallFeedback ? `
                            <div class="panel-card" style="background:#f8faf7;">
                              <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:10px;">
                                <span class="badge-pill badge-lime" style="font-size:0.9rem;">${'★'.repeat(selStu.overallFeedback.rating)}${'☆'.repeat(5 - selStu.overallFeedback.rating)} (${selStu.overallFeedback.rating}/5)</span>
                                <span style="font-size:0.78rem; color:var(--charcoal-65);">${selStu.overallFeedback.updatedAt || ''}</span>
                              </div>
                              <p style="font-size:0.96rem; line-height:1.6; color:var(--charcoal); white-space:pre-wrap;">${selStu.overallFeedback.text}</p>
                            </div>
                          ` : '<p style="color:var(--charcoal-65);">This student has not submitted overall feedback yet.</p>'}
                        ` : `
                          ${(() => {
                            const evMap = selStu.eventFeedbacks || {};
                            const entries = Object.values(evMap);
                            if (!entries.length) {
                              return '<p style="color:var(--charcoal-65);">This student has not submitted any event feedback yet.</p>';
                            }
                            return `<div style="display:flex; flex-direction:column; gap:12px;">` + entries.map(ef => `
                              <div class="panel-card" style="background:#f8faf7;">
                                <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:8px;">
                                  <strong style="font-size:1.05rem;">${ef.eventTitle}</strong>
                                  <span class="badge-pill badge-lime">${'★'.repeat(ef.rating)}${'☆'.repeat(5 - ef.rating)} (${ef.rating}/5)</span>
                                </div>
                                <p style="font-size:0.94rem; line-height:1.6; color:var(--charcoal); white-space:pre-wrap;">${ef.text}</p>
                                <div style="font-size:0.76rem; color:var(--charcoal-65); margin-top:6px;">${ef.updatedAt || ''}</div>
                              </div>
                            `).join('') + `</div>`;
                          })()}
                        `}
                      </div>
                    ` : `
                      <div style="display:flex; flex-direction:column; gap:10px;">
                        ${state.students.map(stu => {
                          const hasOverall = !!stu.overallFeedback;
                          const evCount = stu.eventFeedbacks ? Object.keys(stu.eventFeedbacks).length : 0;
                          const statusBadge = cat === 'overall'
                            ? (hasOverall ? `<span class="badge-pill badge-lime">★ ${stu.overallFeedback.rating}/5</span>` : `<span class="badge-pill badge-forest">No Feedback</span>`)
                            : (evCount > 0 ? `<span class="badge-pill badge-lime">${evCount} Event${evCount > 1 ? 's' : ''} Rated</span>` : `<span class="badge-pill badge-forest">No Feedback</span>`);
                          return `
                            <div class="student-row-card" onclick="selectFeedbackStudent('${stu.id}')">
                              <div>
                                <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                                  <strong style="font-size:1.05rem;">${stu.name}</strong>
                                  ${stu.regNo ? `<span class="badge-pill badge-lime">${stu.regNo}</span>` : ''}
                                </div>
                                <p style="font-size:0.84rem; color:var(--charcoal-65); margin-top:4px;">
                                  ${stu.studentClass} · ${stu.place}
                                </p>
                              </div>
                              ${statusBadge}
                            </div>
                          `;
                        }).join('')}
                      </div>
                    `}
                  `;
                })()}
              ` : state.adminTab === 'certificate' ? `
                ${(() => {
                  const cf = state.certFilter || 'All';
                  const appliedCount = state.students.filter(x => x.certStatus && x.certStatus !== 'none').length;
                  const notAppliedCount = state.students.length - appliedCount;
                  const allowedCount = state.students.filter(x => x.certStatus === 'allowed').length;
                  const list = state.students.filter(stu => {
                    const st = stu.certStatus || 'none';
                    if (cf === 'Applied') return st !== 'none';
                    if (cf === 'Not Applied') return st === 'none';
                    if (cf === 'Allowed') return st === 'allowed';
                    return true;
                  });
                  return `
                    <div class="panel-card" style="margin-bottom: 18px;">
                      <div class="section-kicker" style="margin-bottom:4px;">CERTIFICATES</div>
                      <h2 style="font-size:1.8rem; font-weight:800; line-height:1.15;">E-Certificate Requests</h2>
                      <p style="font-size:0.88rem; color:var(--charcoal-65); margin-top:4px;">Review students who applied or have not applied yet, and Allow or Deny their E-Certificate.</p>
                      <div class="chip-row" style="margin-top:14px; margin-bottom:0;">
                        <button type="button" class="filter-chip ${cf === 'All' ? 'active' : ''}" onclick="setCertFilter('All')">All (${state.students.length})</button>
                        <button type="button" class="filter-chip ${cf === 'Applied' ? 'active' : ''}" onclick="setCertFilter('Applied')">Applied (${appliedCount})</button>
                        <button type="button" class="filter-chip ${cf === 'Not Applied' ? 'active' : ''}" onclick="setCertFilter('Not Applied')">Not Applied (${notAppliedCount})</button>
                        <button type="button" class="filter-chip ${cf === 'Allowed' ? 'active' : ''}" onclick="setCertFilter('Allowed')">Allowed (${allowedCount})</button>
                      </div>
                    </div>

                    <div style="display:flex; flex-direction:column; gap:10px;">
                      ${list.length ? list.map(stu => {
                        const st = stu.certStatus || 'none';
                        const badgeHtml = st === 'allowed'
                          ? '<span class="badge-pill badge-lime">Allowed</span>'
                          : st === 'denied'
                            ? '<span class="badge-pill badge-forest">Denied (Waiting)</span>'
                            : st === 'pending'
                              ? '<span class="badge-pill badge-lime">Applied · Pending</span>'
                              : '<span class="badge-pill badge-forest">Not Applied</span>';
                        return `
                          <div class="student-row-card" style="cursor:default; gap:12px; flex-wrap:wrap;">
                            <div>
                              <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                                <strong style="font-size:1.05rem;">${stu.name}</strong>
                                ${stu.regNo ? `<span class="badge-pill badge-lime">${stu.regNo}</span>` : ''}
                                ${badgeHtml}
                              </div>
                              <p style="font-size:0.84rem; color:var(--charcoal-65); margin-top:4px;">
                                ${stu.studentClass} · ${stu.place}${stu.certAppliedAt ? ' · Applied: ' + stu.certAppliedAt : ''}
                              </p>
                            </div>
                            <div style="display:flex; gap:8px; flex-wrap:wrap;">
                              <button type="button" class="${st === 'allowed' ? 'btn-primary' : 'btn-secondary'}" style="padding:8px 16px; font-size:0.82rem;" onclick="setStudentCertStatus('${stu.id}', 'allowed')">
                                Allow
                              </button>
                              <button type="button" class="btn-secondary" style="padding:8px 16px; font-size:0.82rem; ${st === 'denied' ? 'border-color:#b91c1c; color:#b91c1c;' : ''}" onclick="setStudentCertStatus('${stu.id}', 'denied')">
                                Deny
                              </button>
                            </div>
                          </div>
                        `;
                      }).join('') : '<div class="panel-card"><p style="color:var(--charcoal-65);">No students match this filter.</p></div>'}
                    </div>
                  `;
                })()}
              ` : `
                ${(() => {
                  const paidList = state.students.filter(x => x.paymentCompleted);
                  const d = state.attendanceDay;
                  const presentCount = paidList.filter(x => x.attendance && x.attendance[d]).length;
                  const absentCount = paidList.length - presentCount;
                  const dayLabels = { 1: 'Day 1 · 24 Dec 2026', 2: 'Day 2 · 25 Dec 2026', 3: 'Day 3 · 26 Dec 2026' };
                  return `
                    <div class="panel-card" style="margin-bottom: 18px; display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:14px;">
                      <div>
                        <div class="section-kicker" style="margin-bottom:4px;">3-DAY CAMP ATTENDANCE</div>
                        <h2 style="font-size:1.8rem; font-weight:800; line-height:1.15;">${dayLabels[d]}</h2>
                        <p style="font-size:0.88rem; color:var(--charcoal-65); margin-top:4px;">Showing all payment-completed students. Tick the box to mark Present.</p>
                      </div>
                      <button type="button" class="btn-primary" style="padding:11px 20px; font-size:0.86rem;" onclick="exportAttendanceCSV()">
                        Export Attendance CSV
                      </button>
                    </div>

                    <div class="chip-row" style="margin-bottom:16px;">
                      <button type="button" class="filter-chip ${d === 1 ? 'active' : ''}" onclick="setAttendanceDay(1)">Day 1 · 24 Dec</button>
                      <button type="button" class="filter-chip ${d === 2 ? 'active' : ''}" onclick="setAttendanceDay(2)">Day 2 · 25 Dec</button>
                      <button type="button" class="filter-chip ${d === 3 ? 'active' : ''}" onclick="setAttendanceDay(3)">Day 3 · 26 Dec</button>
                    </div>

                    <div class="portal-stats-4" style="grid-template-columns: repeat(3, 1fr);">
                      <div class="portal-stat-box">
                        <div class="stat-label">PAID STUDENTS</div>
                        <div style="font-size:1.7rem; font-weight:800;">${paidList.length}</div>
                      </div>
                      <div class="portal-stat-box">
                        <div class="stat-label">PRESENT (DAY ${d})</div>
                        <div style="font-size:1.7rem; font-weight:800; color:var(--forest);">${presentCount}</div>
                      </div>
                      <div class="portal-stat-box">
                        <div class="stat-label">ABSENT (DAY ${d})</div>
                        <div style="font-size:1.7rem; font-weight:800;">${absentCount}</div>
                      </div>
                    </div>

                    <div style="display:flex; flex-direction:column; gap:10px;">
                      ${paidList.length ? paidList.map(stu => {
                        const isPres = !!(stu.attendance && stu.attendance[d]);
                        return `
                          <div class="student-row-card" style="cursor:default;">
                            <div>
                              <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                                <span class="badge-pill badge-lime">${stu.regNo || 'NO ID'}</span>
                                <strong style="font-size:1.05rem;">${stu.name}</strong>
                              </div>
                              <p style="font-size:0.84rem; color:var(--charcoal-65); margin-top:4px;">
                                ${stu.studentClass} · ${stu.place}
                              </p>
                            </div>
                            <label class="tick-label" style="padding:8px 14px; border-radius:9999px; border:1.5px solid var(--forest); background:${isPres ? 'var(--lime)' : 'var(--white)'}; color:var(--charcoal);">
                              <input type="checkbox" ${isPres ? 'checked' : ''} onchange="toggleAttendance('${stu.id}', this.checked)" />
                              <span>${isPres ? 'Present' : 'Mark Present'}</span>
                            </label>
                          </div>
                        `;
                      }).join('') : '<div class="panel-card"><p style="color:var(--charcoal-65);">No payment-completed students yet. Tick "Complete Payment" in Registered Students first.</p></div>'}
                    </div>
                  `;
                })()}
              `}
            </div>
          </div>
        `;
        if (state.adminTab === 'students' && !selectedStu) {
          renderAdminStudentsList();
        }
        return;
      }
    }

    renderAuth();
    showFlash();
  </script>
</body>
</html>
